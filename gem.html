<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Камень — Alchemyth</title>
<style>
html,body{margin:0;height:100%;background:#FAF7F0;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0}
.hint{position:fixed;left:0;right:0;bottom:20px;text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#b3a headers}
</style>
</head>
<body>
<div id="stage"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";
const stage=document.getElementById("stage");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(26,1,0.1,100);
camera.position.set(0,0.2,8.6);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
function cutGeo(){
 const N=24,TAU=Math.PI*2;
 const rings=[[0.50,0.34,0],[0.74,0.24,0.5],[0.92,0.12,0],[1.00,0.00,0.5],[0.985,-0.05,0.5],[0.84,-0.36,0],[0.58,-0.68,0.5],[0.28,-0.94,0]];
 const pos=[];
 const P=(ri,i)=>{const r=rings[ri];const a=(i+r[2])/N*TAU;return [Math.cos(a)*r[0],r[1],Math.sin(a)*r[0]];};
 const tri=(a,b,c)=>{pos.push(...a,...b,...c);};
 for(let i=0;i<N;i++){tri([0,rings[0][1],0],P(0,i),P(0,i+1));}
 for(let k=0;k<rings.length-1;k++){for(let i=0;i<N;i++){
  const a=P(k,i),b=P(k,i+1),c=P(k+1,i),d=P(k+1,i+1);tri(a,c,d);tri(a,d,b);}}
 const last=rings.length-1;
 for(let i=0;i<N;i++){tri(P(last,i+1),P(last,i),[0,-1.10,0]);}
 const g=new THREE.BufferGeometry();
 g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
 g.computeVertexNormals();return g;}
const geo=cutGeo();
const BRASS=0xB08D57, DEEP=0x8A6C3E;
const faces=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({
 color:BRASS,transparent:true,opacity:0.05,side:THREE.DoubleSide,depthWrite:false}));
const shade=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({
 color:0xEFE4CE,transparent:true,opacity:0.30,flatShading:true,side:THREE.DoubleSide,depthWrite:false}));
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,1),
 new THREE.LineBasicMaterial({color:DEEP,transparent:true,opacity:0.85}));
const nodes=new THREE.Points(geo,new THREE.PointsMaterial({
 color:BRASS,size:0.045,sizeAttenuation:true,transparent:true,opacity:0.9}));
const gem=new THREE.Group();gem.add(faces);gem.add(shade);gem.add(edges);gem.add(nodes);
gem.scale.setScalar(1.55);
const halo=new THREE.Mesh(new THREE.RingGeometry(2.35,2.38,96),
 new THREE.MeshBasicMaterial({color:BRASS,transparent:true,opacity:0.22,side:THREE.DoubleSide}));
const pivot=new THREE.Group();pivot.add(gem);scene.add(pivot);scene.add(halo);
scene.add(new THREE.AmbientLight(0xffffff,0.55));
const d1=new THREE.DirectionalLight(0xffffff,1.1);d1.position.set(3,5,4);scene.add(d1);
const d2=new THREE.DirectionalLight(0xC9A873,0.7);d2.position.set(-4,-2,-3);scene.add(d2);
function size(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener("resize",size);size();
renderer.setAnimationLoop(ms=>{const t=ms*0.001;
 pivot.rotation.y=t*0.30;pivot.rotation.x=Math.sin(t*0.19)*0.44;pivot.rotation.z=Math.cos(t*0.13)*0.18;
 halo.rotation.z=-t*0.06;
 renderer.render(scene,camera);});
</script>
</body>
</html>
