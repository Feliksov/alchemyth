<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Камень — Alchemyth</title>
<style>
html,body{margin:0;height:100%;background:#FAF7F0;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0}
.hint{position:fixed;left:0;right:0;bottom:20px;text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a99f8c}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint">alchemyth · 3d</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";
const stage=document.getElementById("stage");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28,1,0.1,100);
camera.position.set(0,0.25,8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
stage.appendChild(renderer.domElement);
function envTex(){
 const c=document.createElement("canvas");c.width=1024;c.height=512;const x=c.getContext("2d");
 const g=x.createLinearGradient(0,0,0,512);
 g.addColorStop(0,"#ffffff");g.addColorStop(.30,"#FBF3E4");g.addColorStop(.52,"#D8BC8C");
 g.addColorStop(.74,"#7A6647");g.addColorStop(1,"#1E1913");
 x.fillStyle=g;x.fillRect(0,0,1024,512);
 const sp=[[150,110,90],[470,70,60],[790,140,80],[300,290,55],[660,330,65],[950,260,50]];
 sp.forEach(p=>{const rg=x.createRadialGradient(p[0],p[1],0,p[0],p[1],p[2]);
  rg.addColorStop(0,"rgba(255,255,255,1)");rg.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=rg;x.beginPath();x.arc(p[0],p[1],p[2],0,7);x.fill();});
 const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
 t.colorSpace=THREE.SRGBColorSpace;return t;}
const pmrem=new THREE.PMREMGenerator(renderer);
const env=pmrem.fromEquirectangular(envTex()).texture;
scene.environment=env;
function cutGeo(){
 const N=24,TAU=Math.PI*2;
 const rings=[[0.50,0.34,0],[0.74,0.24,0.5],[0.92,0.12,0],[1.00,0.00,0.5],[0.985,-0.05,0.5],[0.84,-0.36,0],[0.58,-0.68,0.5],[0.28,-0.94,0]];
 const pos=[];
 const P=(ri,i)=>{const r=rings[ri];const a=(i+r[2])/N*TAU;return [Math.cos(a)*r[0],r[1],Math.sin(a)*r[0]];};
 const tri=(a,b,c)=>{pos.push(...a,...b,...c);};
 for(let i=0;i<N;i++){tri([0,rings[0][1],0],P(0,i),P(0,i+1));}
 for(let k=0;k<rings.length-1;k++){
  for(let i=0;i<N;i++){
   const a=P(k,i),b=P(k,i+1),c=P(k+1,i),d=P(k+1,i+1);
   tri(a,c,d);tri(a,d,b);}}
 const last=rings.length-1;
 for(let i=0;i<N;i++){tri(P(last,i+1),P(last,i),[0,-1.10,0]);}
 const g=new THREE.BufferGeometry();
 g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
 g.computeVertexNormals();return g;}
const mat=new THREE.MeshPhysicalMaterial({
 color:0xF2EADB,metalness:0,roughness:0.04,
 transparent:true,opacity:0.62,
 envMap:env,envMapIntensity:2.4,
 clearcoat:1,clearcoatRoughness:0.01,
 flatShading:true,side:THREE.DoubleSide});
const gem=new THREE.Mesh(cutGeo(),mat);
gem.scale.setScalar(1.45);
const pivot=new THREE.Group();pivot.add(gem);scene.add(pivot);
scene.add(new THREE.AmbientLight(0xffffff,0.35));
const k1=new THREE.DirectionalLight(0xffffff,1.6);k1.position.set(4,6,5);scene.add(k1);
const k2=new THREE.DirectionalLight(0xEBD6AE,0.9);k2.position.set(-5,-2,-4);scene.add(k2);
function size(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener("resize",size);size();
renderer.setAnimationLoop(ms=>{const t=ms*0.001;
 pivot.rotation.y=t*0.32;pivot.rotation.x=Math.sin(t*0.2)*0.40;pivot.rotation.z=Math.cos(t*0.14)*0.15;
 renderer.render(scene,camera);});
</script>
</body>
</html>
