<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Камень — Alchemyth</title>
<style>
  html,body{margin:0;height:100%;background:#FAF7F0;font-family:system-ui,sans-serif;color:#3A3630}
  #stage{position:fixed;inset:0}
  .hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9a927f}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint">portuguese cut · 3d</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const stage=document.getElementById('stage');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,0.1,100);
camera.position.set(0,0.6,6.2);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);

function envTex(){
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#ffffff');g.addColorStop(.42,'#F3E6CE');g.addColorStop(.62,'#B08D57');g.addColorStop(1,'#4A4034');
  x.fillStyle=g;x.fillRect(0,0,256,256);
  x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.arc(70,58,26,0,7);x.fill();
  x.fillStyle='rgba(255,240,215,.6)';x.beginPath();x.arc(195,120,40,0,7);x.fill();
  const t=new THREE.CubeTexture([c,c,c,c,c,c]);t.needsUpdate=true;return t;
}
const env=envTex();
scene.environment=env;

function gemGeo(){
  const p=[];
  p.push(new THREE.Vector2(0.001,-1.35));
  p.push(new THREE.Vector2(0.40,-0.92));
  p.push(new THREE.Vector2(0.74,-0.50));
  p.push(new THREE.Vector2(0.94,-0.18));
  p.push(new THREE.Vector2(1.00,0.00));
  p.push(new THREE.Vector2(0.97,0.07));
  p.push(new THREE.Vector2(0.86,0.20));
  p.push(new THREE.Vector2(0.68,0.32));
  p.push(new THREE.Vector2(0.44,0.40));
  p.push(new THREE.Vector2(0.001,0.43));
  const g=new THREE.LatheGeometry(p,24);
  g.computeVertexNormals();
  return g;
}

const mat=new THREE.MeshPhysicalMaterial({
  color:0xffffff,metalness:0,roughness:0.02,
  transmission:0.96,thickness:1.4,ior:2.42,
  clearcoat:1,clearcoatRoughness:0.02,
  envMap:env,envMapIntensity:2.4,
  flatShading:true,side:THREE.DoubleSide
});

const gem=new THREE.Mesh(gemGeo(),mat);
gem.scale.set(1.35,1.35,1.0);
const pivot=new THREE.Group();pivot.add(gem);scene.add(pivot);

const halo=new THREE.Mesh(new THREE.SphereGeometry(2.6,32,32),
  new THREE.MeshBasicMaterial({color:0xB08D57,transparent:true,opacity:0.05,side:THREE.BackSide}));
scene.add(halo);

scene.add(new THREE.AmbientLight(0xffffff,0.7));
const k=new THREE.DirectionalLight(0xffffff,2.2);k.position.set(3,4,5);scene.add(k);
const f=new THREE.DirectionalLight(0xF3E0BE,1.4);f.position.set(-4,-2,-3);scene.add(f);
const rim=new THREE.PointLight(0xB08D57,2.0,14);rim.position.set(-2,3,-4);scene.add(rim);

function size(){
  const w=stage.clientWidth,h=stage.clientHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
}
addEventListener('resize',size);size();

let t0=0;
function loop(ms){
  const t=ms*0.001;
  pivot.rotation.y=t*0.32;
  pivot.rotation.x=Math.sin(t*0.21)*0.38;
  pivot.rotation.z=Math.cos(t*0.15)*0.14;
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
