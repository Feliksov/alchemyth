name: stamp-assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    if: >-
      github.event.head_commit.author.username != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/stamp-assets.js

      - name: Commit stamped HTML if changed
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No asset version changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "chore: stamp asset versions [skip ci]"
          git push
